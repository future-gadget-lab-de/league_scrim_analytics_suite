stages:
  - base-runnable
  - build
  - deploy

main-test:
  stage: base-runnable
  tags:
    - doc
  image: python:3.12
  script:
    - apt-get update && apt-get install -y --no-install-recommends libgl1 libegl1 libopengl0 libglib2.0-0 libdbus-1-3 libx11-6 libx11-xcb1 libxcb1 libxcb-cursor0 libxcb-xinerama0 libxkbcommon0 libxkbcommon-x11-0 libxext6 libxrender1 libxi6 libxfixes3 libxrandr2 libsm6 libice6 libfontconfig1 libfreetype6 libharfbuzz0b libasound2 libnss3 xvfb && rm -rf /var/lib/apt/lists/*
    - python -V
    - python -m pip install --upgrade pip
    - apt-get update && apt-get install -y graphviz
    - apt-get update && apt-get install -y gcc python3-dev pkg-config libmariadb-dev
    - apt-get update && apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0
    - rm -rf /var/lib/apt/lists/*
    - pip install virtualenv
    - virtualenv venv
    - source venv/bin/activate
    - pip install -r requirements.txt
    - python ./src/main.py
    - echo "successful"

binaries:
  stage: build
  tags:
    - doc
  image: ubuntu
  script:
    - apt-get update && apt-get install -y --no-install-recommends libgl1 libegl1 libopengl0 libglib2.0-0 libdbus-1-3 libx11-6 libx11-xcb1 libxcb1 libxcb-cursor0 libxcb-xinerama0 libxkbcommon0 libxkbcommon-x11-0 libxext6 libxrender1 libxi6 libxfixes3 libxrandr2 libsm6 libice6 libfontconfig1 libfreetype6 libharfbuzz0b libasound2 libnss3 xvfb && rm -rf /var/lib/apt/lists/*
    - apt-get update && apt-get install -y graphviz make
    - apt-get update && apt-get install -y gcc python3-dev pkg-config libmariadb-dev
    - apt-get update && apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0
    - rm -rf /var/lib/apt/lists/*
    - make build
    - echo "successful"
  artifacts:
    paths:
      - lsas_build

sphinx:
  stage: build
  tags:
    - doc
  image: python:3.12-slim
  script:
    - python -V
    - python -m pip install --upgrade pip
    - apt-get update && apt-get install -y graphviz
    - apt-get update && apt-get install -y gcc python3-dev pkg-config libmariadb-dev
    - apt-get update && apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0
    - rm -rf /var/lib/apt/lists/*
    - pip install virtualenv
    - virtualenv venv
    - source venv/bin/activate
    - pip install -r requirements.txt
    - python ./src/visuals/ui/compile_ui.py
    - python ./docs/markdown_setup.py
    - sphinx-apidoc -f -o docs/source/api src --separate --templatedir=docs/source/_templates
    - sphinx-build -b html docs/source public
    - echo "El Psy Kongroo"
  artifacts:
    paths:
      - public

pages:
  stage: deploy
  tags:
    - doc
  image: alpine:3.20
  needs: ["sphinx"]
  script:
    - echo "Publishing Sphinx site from public/"
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
