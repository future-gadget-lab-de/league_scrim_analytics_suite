stages: [doc]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

build_sphinx:
  stage: doc
  tags:
    - doc
  image: python:3.12-slim
  script:
    - python -V
    - python -m pip install --upgrade pip
    - apt-get update && apt-get install -y graphviz
    - apt-get update && apt-get install -y gcc python3-dev pkg-config libmariadb-dev
    - apt-get update && apt-get install -y --no-install-recommends libegl1 libgl1
    - rm -rf /var/lib/apt/lists/*
    - pip install virtualenv
    - virtualenv venv
    - source venv/bin/activate
    - pip install -r requirements.txt
    - python ./src/visuals/ui/compile_ui.py
    - sphinx-apidoc -f -o docs/source/api src --separate --templatedir=docs/source/_templates
    - sphinx-build -b html docs/source docs/_build/html
  artifacts:
    when: always
    paths:
      - docs/_build/html
    expire_in: 14 days
  rules:
    - if: $CI_COMMIT_BRANCH
